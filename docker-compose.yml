services:
  redis:
    image: redis:7
    container_name: safepaw-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  web:
    build: .
    command: pixi run -m backend python -m uvicorn backend.run:app --host 0.0.0.0 --port 5000
    ports:
      - "5000:5000"
    depends_on:
      - redis
    restart: unless-stopped

  worker:
    build: .
    command: rq worker -u redis://redis:6379 safepaw
    depends_on:
      - redis
    restart: unless-stopped