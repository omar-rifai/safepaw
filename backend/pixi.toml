[workspace]
name = "safepaw"
version = "0.1.0"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64", "osx-arm64"]

[dependencies]
python = ">=3.11"
fastapi = ">=0.123.7,<0.124.0"
geopandas = ">=1.1.1,<2.0.0"
numpy = ">=2.3.5,<3.0.0"
pandas = ">=2.3.3,<3.0.0"
pydantic = ">=2.12.5,<3.0.0"
shapely = ">=2.1.2,<3.0.0"
uvicorn = ">=0.38.0,<0.39.0"
highspy = ">=1.12.0,<2.0.0"
"python-multipart" = ">=0.0.20,<0.0.21"
pyproj = ">=3.6.0,<4.0.0"
pyarrow = ">=23.0.0,<24.0.0"
typer = ">=0.21.1,<0.22.0"
pyyaml = ">=6.0.3,<7.0.0"
lark = ">=1.3.1,<2"
sqlmodel = ">=0.0.38,<0.0.39"
janus = ">=2.0.0,<3"

[pypi-dependencies]
pulp = ">=3.3.0,<4.0.0"
gurobipy = ">=13.0.1,<14.0.0"
